<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Archive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <span class="mark" aria-hidden="true"></span>
    <h1>Game Archive<span class="dot">.</span></h1>
    <p class="count" id="count">—</p>
    <p class="serial" id="serial">A—01</p>
  </div>
  <div class="controls">
    <input id="search" class="search" type="search" placeholder="Cerca un titolo…" autocomplete="off" spellcheck="false">
    <select id="platform" class="select" aria-label="Piattaforma"><option value="">Tutte le piattaforme</option></select>
    <select id="genre" class="select" aria-label="Genere"><option value="">Tutti i generi</option></select>
    <select id="decade" class="select" aria-label="Decennio"><option value="">Tutti gli anni</option></select>
    <select id="sort" class="select" aria-label="Ordinamento">
      <option value="title">Titolo A→Z</option>
      <option value="title-desc">Titolo Z→A</option>
      <option value="year-desc">Più recenti</option>
      <option value="year">Più vecchi</option>
      <option value="rating">Voto più alto</option>
    </select>
    <button id="reset" class="ghost" type="button">Azzera</button>
    <button id="theme" class="theme-toggle" type="button" aria-label="Cambia tema" title="Cambia tema">◐</button>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>Nessun gioco corrisponde ai filtri.</p>
</main>

<div id="dialog" class="dialog" hidden>
  <div class="dialog-backdrop" data-close></div>
  <article class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <button class="dialog-close" type="button" data-close aria-label="Chiudi">✕</button>
    <div class="dialog-body">
      <img id="d-cover" class="dialog-cover" alt="" hidden>
      <div class="dialog-info">
        <h2 id="d-title"></h2>
        <p id="d-meta" class="dialog-meta"></p>
        <p id="d-summary" class="dialog-summary"></p>
        <dl id="d-details" class="dialog-details"></dl>
        <a id="d-link" class="dialog-link" href="#" target="_blank" rel="noopener">Scheda su IGDB →</a>
      </div>
    </div>
  </article>
</div>

<footer class="footer">
  <span id="generated"></span>
  <span class="bar"></span>
  <span>Dati e copertine: <a href="https://www.igdb.com" target="_blank" rel="noopener">IGDB</a></span>
</footer>

<script src="data/games.js"></script>
<script src="app.js"></script>
</body>
</html>
